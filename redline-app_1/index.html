<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="redline-standalone" content="1">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Redline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Redline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first app shell, black + red + white. Condensed display caps, red signal color for "now" and priority, bottom tab bar. Dark-first; light variant mirrors it on white. */
:root{
  --bg:#050505; --surface:#121212; --surface2:#1c1c1c; --line:#2a2a2a;
  --ink:#f5f5f5; --muted:#a3a3a3; --red:#ff2a3a; --red-ink:#ffffff; --red-soft:#2a0d10; --red-text:#ff5c69;
  --scrim:rgb(0 0 0 / .65);
  --c1:#ffffff; --c2:#ff2a3a; --c3:#ff9aa2; --c4:#8c8c8c; --c5:#b3121f;
  --f-disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:22px; --r:16px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f4f4f4; --surface:#ffffff; --surface2:#ececec; --line:#dcdcdc;
  --ink:#0a0a0a; --muted:#5c5c5c; --red:#d90f20; --red-ink:#ffffff; --red-soft:#fde6e8; --red-text:#c00d1c;
  --scrim:rgb(0 0 0 / .5);
  --c1:#0a0a0a; --c2:#d90f20; --c3:#e8707a; --c4:#7a7a7a; --c5:#8f0a15;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f4f4f4; --surface:#ffffff; --surface2:#ececec; --line:#dcdcdc;
  --ink:#0a0a0a; --muted:#5c5c5c; --red:#d90f20; --red-ink:#ffffff; --red-soft:#fde6e8; --red-text:#c00d1c;
  --scrim:rgb(0 0 0 / .5);
  --c1:#0a0a0a; --c2:#d90f20; --c3:#e8707a; --c4:#7a7a7a; --c5:#8f0a15;
  color-scheme:light}
.c-school{--cat:var(--c1)} .c-work{--cat:var(--c2)} .c-health{--cat:var(--c3)} .c-personal{--cat:var(--c4)} .c-chores{--cat:var(--c5)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-block:18px calc(112px + env(safe-area-inset-bottom,0px))}

.top{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px}
.top .txt{flex:1;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--red-text);margin:0}
.h1{font-family:var(--f-disp);font-size:42px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:6px 0 0;text-wrap:balance}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:var(--surface2)}
.ring .fg{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset .5s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ink)}

.navrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.navrow .sp{flex:1}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:18px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:62px;transition:transform .15s var(--ease),background .2s}
.dchip:active{transform:scale(.94)}
.dchip span{font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.dchip b{font-family:var(--f-disp);font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.dchip em{width:5px;height:5px;border-radius:50%;background:var(--red)}
.dchip em.n{visibility:hidden}
.dchip.on{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.dchip.on span{color:inherit;opacity:.85}
.dchip.on em{background:var(--red-ink)}
.dchip.today:not(.on){border-color:var(--ink)}

.hero{border-radius:var(--r-lg);padding:20px;margin-bottom:18px;position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.hero.live{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.hero.live::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:28px solid rgb(255 255 255 / .1)}
.hero .k{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--red-text)}
.hero.live .k{color:var(--red-ink)}
.pulse{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.hero h2{font-family:var(--f-disp);font-size:34px;font-weight:800;text-transform:uppercase;line-height:1;margin:8px 0 6px;overflow-wrap:anywhere;position:relative}
.hero .when{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;opacity:.9;position:relative}
.hero .bar{height:6px;border-radius:99px;background:rgb(255 255 255 / .25);margin-top:16px;overflow:hidden;position:relative}
.hero .bar i{display:block;height:100%;background:var(--red-ink);border-radius:99px}
.hero .after{margin-top:12px;font-size:14px;color:var(--muted);position:relative}
.hero.live .after{color:var(--red-ink);opacity:.85}
.hero .after b{font-weight:700;color:inherit}
.hero:not(.live) .after b{color:var(--ink)}

.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.sec{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;min-width:0}
.sh{display:flex;align-items:center;gap:10px}
.sh h3{font-family:var(--f-disp);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
.sh .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sh .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

.quick{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-bottom:8px;transition:border-color .2s}
.quick:focus-within{border-color:var(--red)}
.quick input{flex:1;min-width:0;border:none;background:none;padding:10px;font-size:16px;outline:none}
.quick input::placeholder{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0 4px 20px}
.hint code{font-family:var(--f-mono);font-size:12px;background:var(--surface2);padding:1px 6px;border-radius:6px;color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid transparent;border-radius:var(--r-sm);padding:0 18px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--ink);transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--red);color:var(--red-ink)}
.btn.out{background:none;border-color:var(--line)}
.btn.ghost{background:none;color:var(--muted)}
.btn.danger{background:none;color:var(--red-text)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.ib{width:44px;height:44px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.ib:active{transform:scale(.94)}

.tl{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:stretch;position:relative}
.it .tm{font-family:var(--f-mono);font-size:13px;font-weight:600;text-align:right;padding-top:14px;font-variant-numeric:tabular-nums;line-height:1.25}
.it .tm small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.blk{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden;min-width:0;transition:opacity .2s,border-color .2s}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat)}
.blk.r{background:var(--surface2);border-color:transparent}
.blk.done{opacity:.45}
.blk.done .t{text-decoration:line-through}
.blk.live{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 8px 24px -10px color-mix(in srgb,var(--red) 60%,transparent)}
.body{flex:1;min-width:0;cursor:pointer;background:none;border:none;text-align:left;padding:0}
.t{font-weight:700;font-size:16px;overflow-wrap:anywhere;line-height:1.3}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--cat)}
.pill.hi{border-color:var(--red);color:var(--red-text)}
.pill.cal{border-color:var(--ink);color:var(--ink)}
.chk{appearance:none;flex:none;width:28px;height:28px;margin:0;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s,transform .15s var(--ease)}
.chk:hover{border-color:var(--red)}
.chk:active{transform:scale(.86)}
.chk:checked{background:var(--red);border-color:var(--red)}
.chk:checked::after{content:"";width:7px;height:12px;border:solid var(--red-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.gap{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;position:relative}
.gap .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;padding-top:8px}
.gap .fr2{border:1px dashed var(--line);border-radius:var(--r-sm);padding:7px 12px;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.nowline{position:absolute;left:64px;right:0;height:0;border-top:2px solid var(--red);z-index:2;pointer-events:none}
.nowline::before{content:"NOW";position:absolute;left:-58px;top:-8px;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--red-text);letter-spacing:.1em}
.nowline::after{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:24px 16px;background:var(--surface);border-radius:var(--r);border:1px dashed var(--line)}
.empty b{display:block;color:var(--ink);font-family:var(--f-disp);font-size:20px;text-transform:uppercase;margin-bottom:4px}

.mini{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.mini.done .t{text-decoration:line-through;color:var(--muted)}

.df{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px 14px}
.df.hot{border-color:var(--red)}
.note{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.df > .note:last-of-type{border-bottom:none}
.note.done .t{text-decoration:line-through;color:var(--muted)}
.note .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.pinb{width:40px;height:40px;border:none;border-radius:10px;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.pinb.on{color:var(--red-text)}
.pinb svg.i{width:19px;height:19px}
.pinb.on svg.i{fill:currentColor}
.due{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.due.late{color:var(--red-text)}
.seeall{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 8px;font-weight:700;font-size:14px;color:var(--red-text);background:none;border:none;border-top:1px solid var(--line);width:100%}

.rem{border-radius:var(--r-lg);padding:16px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.rem::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--red)}
.rem .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rem .ic{width:40px;height:40px;border-radius:12px;background:var(--red);color:var(--red-ink);display:grid;place-items:center}
.rem h3{margin:0;font-family:var(--f-disp);font-size:20px;font-weight:800;text-transform:uppercase}
.rem p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.rem .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rem select{border:1px solid var(--line);background:var(--surface2);border-radius:10px;min-height:36px;padding:0 8px;font-size:13px;font-weight:600}
.rem .st{font-size:13px;margin-top:10px;color:var(--muted);min-height:1em}
.rem .st.err{color:var(--red-text)}
.rem .st.ok{color:var(--ink)}
.tip{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px}
.tip svg.i{width:18px;height:18px;color:var(--red-text);margin-top:2px}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--red-soft);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;font-size:14px}
.banner .tx{flex:1;min-width:200px}

.segtop{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px;margin-bottom:18px}
.segtop button{border:none;background:none;border-radius:99px;min-height:36px;padding:0 18px;font-family:var(--f-disp);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.segtop button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.wsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--f-disp);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat.r b{color:var(--red-text)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:900px){.week{grid-template-columns:minmax(0,1fr)}}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.wd.today{border-color:var(--red)}
.wh{display:flex;align-items:baseline;gap:8px;border:none;background:none;padding:0;text-align:left;cursor:pointer}
.wh b{font-family:var(--f-disp);font-size:22px;font-weight:800;text-transform:uppercase}
.wd.today .wh b{color:var(--red-text)}
.wh span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wd .rt{font-size:12px;color:var(--muted)}
.wbar{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--surface2);gap:2px}
.wbar i{background:var(--cat)}
.wt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--surface2);border:none;border-left:3px solid var(--cat);font-size:14px;font-weight:600;cursor:pointer;text-align:left;width:100%;overflow-wrap:anywhere;min-width:0}
.wt .tm{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none;padding-top:2px}
.wt.done{opacity:.5;text-decoration:line-through}

.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mh{font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:var(--muted);text-align:center;padding:2px 0 6px;letter-spacing:.08em;text-transform:uppercase}
.mc{min-height:98px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;text-align:left}
.mc.out{opacity:.35}
.mc.today{border-color:var(--red);background:var(--red-soft)}
.mc .d{font-family:var(--f-disp);font-size:18px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mc.today .d{color:var(--red-text)}
.mc .mt{font-size:11px;font-weight:600;padding:2px 5px;border-radius:5px;background:var(--surface2);border-left:2px solid var(--cat);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .mt.done{text-decoration:line-through;opacity:.55}
.mc .more{font-size:11px;color:var(--muted)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--cat)}
@media (max-width:620px){.mc{min-height:58px;padding:6px}.mc .mt,.mc .more{display:none}.dots{display:flex}}
.goal{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-of-type{border-bottom:none}
.goal span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.goal.done span{text-decoration:line-through;color:var(--muted)}
.del{width:36px;height:36px;border:none;background:none;color:var(--muted);border-radius:10px;display:grid;place-items:center}
.inrow{display:flex;gap:8px;margin-top:10px}
.inrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:var(--r-sm);padding:0 12px;min-height:44px;font-size:16px}

.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.rb{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cat);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;min-width:0;transition:transform .15s var(--ease)}
.rb:active{transform:scale(.98)}
.rb .top2{display:flex;align-items:flex-start;gap:10px}
.rb .t{flex:1;min-width:0}
.rb .tm{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.days{display:flex;gap:4px}
.days i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:600;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.days i.on{background:var(--ink);color:var(--bg)}

function freeGaps(k,busyExtra){
  const busy=itemsFor(k).map(i=>[i.start,i.start+i.dur]).concat(busyExtra||[]).sort((a,b)=>a[0]-b[0]);
  let s=WIN_START; if(k===todayKey())s=Math.max(s,Math.ceil(nowMin()/15)*15);

}

function planWeek(){

  for(const k of days){

  const pool=S.tasks.filter(t=>!t.date&&!t.done).sort((a,b)=>priRank[a.pri||"normal"]-priRank[b.pri||"normal"]||(b.dur-a.dur));
  for(const t of pool){

function autoPlan(k){

function parseQuick(s){
  let time="",dur=30,pri="normal",day="";
  s=s.replace(/\b(\d{1,2})(?::([0-5]\d))?\s*(am|pm)\b/i,(m,h,mm,ap)=>{h=+h%12;if(/p/i.test(ap))h+=12;time=pad(h)+":"+(mm||"00");return ""});
  if(!time)s=s.replace(/\b([01]?\d|2[0-3]):([0-5]\d)\b/,(m,h,mm)=>{time=pad(+h)+":"+mm;return ""});
  s=s.replace(/\b(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours)\b/i,(m,n)=>{dur=Math.round(parseFloat(n)*60);return ""});
  s=s.replace(/\b(\d+)\s*(m|min|mins|minutes)\b/i,(m,n)=>{dur=+n;return ""});
  s=s.replace(/\b(tomorrow|tmrw|tmr)\b/i,()=>{day=addDays(todayKey(),1);return ""});
  s=s.replace(/\btonight\b/i,()=>{day=todayKey();if(!time)time="20:00";return ""});
  s=s.replace(/\btoday\b/i,()=>{day=todayKey();return ""});
  if(s.includes("!")){pri="high";s=s.replace(/!/g,"")}
  return {title:s.replace(/\s+/g," ").trim().replace(/\s+(at|by|on)$/i,""),time,dur:Math.max(5,Math.min(dur,720)),pri,day};
}

    const bg=document.createElement("div");bg.className="swbg";bg.style.cssText=`top:${r.top}px;left:${r.left}px;width:${r.width}px;height:${r.height}px`;
    const canLeft=sw.kind==="t"||sw.kind==="n";
    bg.innerHTML=`<span class="swl">${ICON.checkmark} ${sw.chk.checked?"Undo":"Done"}</span><span class="swr">${canLeft?(sw.kind==="n"?"Snooze":"Tomorrow")+" "+ICON.right:""}</span>`;
    document.body.appendChild(bg); sw.bg=bg; sw.row.classList.add("swiping"); sw.canLeft=canLeft;
    try{sw.row.setPointerCapture(e.pointerId)}catch(err){}
  }
  let d=dx; if(d<0&&!sw.canLeft)d=d/4;
  sw.dx=d; sw.row.style.transform=`translateX(${d}px)`;
  sw.bg.classList.toggle("go-r",d>80); sw.bg.classList.toggle("go-l",d<-80); sw.bg.classList.toggle("left",d<0);
});
function endSwipe(){
  if(!sw)return; const s0=sw; sw=null;
  if(!s0.on)return;
  swBlockClick=Date.now();
  const act=s0.dx>80?"right":(s0.dx<-80&&s0.canLeft?"left":null);
  s0.row.classList.remove("swiping"); s0.row.style.transition="transform .22s var(--ease)";
  s0.row.style.transform=act==="right"?"translateX(100%)":act==="left"?"translateX(-100%)":"";
  setTimeout(()=>{s0.bg&&s0.bg.remove();
    if(act==="right"){s0.chk.checked=!s0.chk.checked;A[s0.chk.dataset.act](s0.chk)}
    else if(act==="left"){buzz();s0.kind==="t"?A.later(s0.id):A.snooze(s0.id)}
    else{s0.row.style.transition="";}
  },act?200:220);
}
document.addEventListener("pointerup",endSwipe);
document.addEventListener("pointercancel",()=>{if(sw&&sw.on){sw.dx=0}endSwipe()});
document.addEventListener("click",e=>{if(swBlockClick&&Date.now()-swBlockClick<350){swBlockClick=0;e.stopPropagation();e.preventDefault()}},true);
window.addEventListener("blur",()=>{if(sw){if(sw.bg)sw.bg.remove();if(sw.row){sw.row.style.transform="";sw.row.classList.remove("swiping")}sw=null}});

setInterval(()=>{if((view==="day"||view==="todo")&&!host.innerHTML&&!F&&!document.activeElement.matches("input,select"))render()},60000);
if(STANDALONE&&"serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
render();
})();
</script>
